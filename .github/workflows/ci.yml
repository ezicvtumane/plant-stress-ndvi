name: Continuous Integration & Test Suite

on:
  push:
    branches: [ main, "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Run Pytest test suite
        run: |
          python -m pytest tests/ -v

      - name: Reproducibility & headless import smoke check
        run: |
          python -c "from web_station import app; from src.statistical_analysis import ExperimentStatistics; df = ExperimentStatistics().load_dataset(); assert len(df) > 0, 'Empty Wave 1 dataset'; print(f'Smoke OK: FastAPI={app.title}, Wave1 rows={len(df)}')"

      - name: Verify tests did not mutate tracked data or docs
        run: |
          git status --porcelain
          git diff --exit-code
